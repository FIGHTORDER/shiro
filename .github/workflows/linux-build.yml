# Builds the Linux packages.
#
# This cannot be done from the Windows machine the project is developed on:
# Tauri does not support cross-compiling to Linux, because the build links
# against WebKitGTK and glibc headers that only exist on the target. So Linux
# artifacts come from here or not at all.
#
# This is the pull request check. Releases are built by build-and-release.yml,
# which builds both platforms together because there is only one update
# manifest and two workflows writing it would race.
#
# NOTE: nothing in this app has ever been RUN on Linux. A green build here means
# it compiles and packages, not that it works. See docs/DESIGN_HANDOFF.md §4 on
# WebKitGTK, which renders differently from the WebView2/Chromium the design was
# verified against.
name: Linux build

on:
  workflow_dispatch:
  # Every pull request into main, whatever the branch is called. The list
  # below used to name feature branches, which meant CI silently stopped
  # running whenever one was renamed or replaced.
  pull_request:
    branches: [main]
  # No push trigger: build-and-release.yml builds Linux on main, and running
  # both would be twenty minutes of runner time to produce the same packages
  # twice.

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 on Linux needs the webview and tray libraries at build time.
      # 22.04 carries webkit2gtk-4.1, which is what Tauri v2 wants; 20.04 only
      # has 4.0 and will not link.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file

      - name: Install dependencies
        run: npm ci

      # Cheap, and a broken build is worth catching before the slow part.
      - name: Unit tests
        run: npm test

      # Catches a platform config that drops a resource the base config ships.
      # `tauri.linux.conf.json` names its own `resources` array, and Tauri
      # REPLACES the base array rather than adding to it - which is how the
      # Linux packages went out with none of Zero-K's campaign in them while
      # every test here stayed green.
      - name: Undefined identifiers, tokens and bundle resources
        run: npm run check:names

      # Linux ships the Steam helper, and `tauri-build` validates `externalBin`
      # from a build script, so this has to come before any cargo invocation
      # rather than before the bundle. Without it `cargo test` below fails on a
      # missing `binaries/shiro-steam-x86_64-unknown-linux-gnu`.
      - name: Build the Steam helper
        run: npm run build:steam

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build packages
        env:
          # linuxdeploy resolves the dependencies of every ELF it is handed and
          # refuses the whole bundle if one cannot be found. The Steam helper
          # links `libsteam_api.so`, which lives on no system path, so the
          # loader is pointed at the copy `build:steam` staged.
          #
          # Without this the AppImage fails at bundling with "Could not find
          # dependency: libsteam_api.so" - the deb and rpm bundle fine, so the
          # run dies most of the way through.
          LD_LIBRARY_PATH: ${{ github.workspace }}/src-tauri/resources/steam
        run: npm run tauri -- build

      - name: Collect the packages
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -printf '%f  %s bytes\n'

      - uses: actions/upload-artifact@v4
        with:
          name: shiro-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/shiro
          if-no-files-found: error
          retention-days: 30
